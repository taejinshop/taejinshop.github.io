<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>태진낚시</title>
  <script>
    // GitHub Pages has no server rewrites. Restore the route in the client app.
    window.location.replace('/?__route=' + encodeURIComponent(
      window.location.pathname + window.location.search + window.location.hash
    ));
  </script>
</head>
<body>
  <p>상품 페이지로 이동하고 있습니다. <a href="/">태진낚시 홈으로 이동</a></p>
</body>
</html>
